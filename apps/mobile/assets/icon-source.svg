<?xml version="1.0" encoding="UTF-8"?>
<!--
  Emrooz mark — two overlapping open brackets.

  Composition:
    ⊓  top-left bracket:  top edge + two short verticals (no bottom)
    ⊔  bottom-right open: left + bottom + right (no top)
    ○  hollow circle inside the lower rectangle, upper area
    all corners sharp — no rounding anywhere

  Palette:
    field   #FFF8ED  cream
    stroke  #254D32  deep green

  Rendered by scripts/render-icons.mjs to every mobile + web target.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect width="1024" height="1024" fill="#FFF8ED"/>

  <g stroke="#254D32" stroke-width="22" stroke-linecap="square" fill="none">
    <!-- Top bracket ⊓ — shifted further right (+80 from previous) -->
    <line x1="245" y1="210" x2="760" y2="210" />
    <line x1="245" y1="210" x2="245" y2="380" />
    <line x1="760" y1="210" x2="760" y2="380" />

    <!-- Lower open rectangle ⊔ — shallower (bottom raised from y=945 to y=845) -->
    <line x1="385" y1="340" x2="385" y2="845" />
    <line x1="385" y1="845" x2="940" y2="845" />
    <line x1="940" y1="340" x2="940" y2="845" />

    <!-- Hollow circle — dead-center of the lower rectangle (x 385..940, y 340..845) -->
    <circle cx="662.5" cy="592.5" r="90" />
  </g>
</svg>
